// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

// Workaround: @sentry/react-native registers under both ':sentry-react-native' (hyphen)
// and ':sentry_react-native' (underscore) depending on Gradle version, causing an implicit
// task dependency error on Gradle 8+. Wire mustRunAfter in both directions to be safe.
gradle.projectsEvaluated {
    def sentryA = findProject(':sentry-react-native')
    def sentryB = findProject(':sentry_react-native')
    [sentryA, sentryB].findAll { it != null }.each { proj ->
        ['Debug', 'Release'].each { variant ->
            def packageTask = proj.tasks.findByName("package${variant}Resources")
            def genTask = proj.tasks.findByName("generate${variant}ResValues")
            if (packageTask != null && genTask != null) {
                packageTask.mustRunAfter(genTask)
            }
        }
    }
    if (sentryA != null && sentryB != null) {
        ['Debug', 'Release'].each { variant ->
            def pkgA = sentryA.tasks.findByName("package${variant}Resources")
            def genB = sentryB.tasks.findByName("generate${variant}ResValues")
            if (pkgA != null && genB != null) { pkgA.mustRunAfter(genB) }
            def pkgB = sentryB.tasks.findByName("package${variant}Resources")
            def genA = sentryA.tasks.findByName("generate${variant}ResValues")
            if (pkgB != null && genA != null) { pkgB.mustRunAfter(genA) }
        }
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
