# Dokploy-only compose for Postgres + Redis.
#
# Differs from repo-root docker-compose.yml in two ways:
#   1. Attaches services to Dokploy's shared overlay network `dokploy-network`
#      so backend / web Swarm services can resolve them by container_name.
#   2. No host port publishing — internal-only, safer for production.
#
# In Dokploy UI:
#   Compose service → Source → Path: dokploy/compose.yml → Redeploy.

services:
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: safetag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safetag
      POSTGRES_PASSWORD: safetag_dev
      POSTGRES_DB: safetag_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    container_name: safetag-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - dokploy-network

volumes:
  pgdata:
  redisdata:

networks:
  dokploy-network:
    external: true
