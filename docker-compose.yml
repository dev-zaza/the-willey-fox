# Host ports 5433 / 6380 avoid clashing with local Postgres (5432) and Redis (6379).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safetag-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: safetag
      POSTGRES_PASSWORD: safetag_dev
      POSTGRES_DB: safetag_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safetag-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
